name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: common + android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon composeApp:allTests
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports
          path: composeApp/build/reports/tests/
      - run: ./gradlew --no-daemon androidApp:assembleDebug

  ios:
    name: ios simulator
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-
      - run: iosApp/sim-smoke.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-smoke
          path: build/ios-smoke/
