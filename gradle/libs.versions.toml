[versions]
kotlin = "2.4.10"
compose-multiplatform = "1.12.1"
compose-hot-reload = "1.2.0"
agp = "9.4.1"
coil = "3.6.3"
ktor = "3.6.0"
coroutines = "1.11.0"
serialization = "1.11.0"
# 0.8.0-0.6.x-compat sorts ABOVE 0.8.0 in Gradle ordering — pin, never "upgrade".
datetime = "0.8.0"
androidx-activityCompose = "1.13.0"
androidx-core = "1.19.1"
media3 = "1.11.0"
mediarouter = "1.8.1"
appcompat = "1.8.0"
play-cast = "22.3.1"
# vlcj 5 (VLC 4) has only milestones; M6 binds libvlc as reworked in June 2026.
vlcj = "5.0.0-M6"
dbus-java = "5.2.2"
# VLC 4 has no stable release yet. 3.x drops and stretches audio for seconds whenever a
# Bluetooth sink wakes from idle (first play, every unpause); 4 resyncs without a glitch.
# Built by github.com/Kobbler-Media/kobvlc: libvlcjni eap29 with our patches, trimmed.
libvlc-android = "4.0.0-eap29-kob9"
# Desktop builds VLC master, which vlcj 5 needs: kobvlc's linux/build.sh.
libvlc-linux = "4.0.0-3127258a-kob3"
# Baseline Profile Gradle Plugin 1.4.x (latest stable) only drives AGP 9 with
# android.newDsl=false, a project-wide opt-out. 1.5.0-rc01 raised its tested AGP
# ceiling to 10.0.0-alpha01 and is the first build that works under AGP 9's DSL.
androidx-benchmark = "1.5.0-rc01"
androidx-uiautomator = "2.4.0"
androidx-test-junit = "1.3.0"
junit = "4.13.2"
robolectric = "4.17"
androidx-test-runner = "1.7.0"
androidx-profileinstaller = "1.4.1"
lifecycle-compose = "2.11.0"
work = "2.12.0"
android-compileSdk = "37"
android-minSdk = "24"
android-targetSdk = "36"

[libraries]
lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle-compose" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-ktor = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
ktor-client-java = { module = "io.ktor:ktor-client-java", version.ref = "ktor" }
ktor-client-js = { module = "io.ktor:ktor-client-js", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activityCompose" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }
mediarouter = { module = "androidx.mediarouter:mediarouter", version.ref = "mediarouter" }
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
play-services-cast-framework = { module = "com.google.android.gms:play-services-cast-framework", version.ref = "play-cast" }
vlcj = { module = "uk.co.caprica:vlcj", version.ref = "vlcj" }
dbus-java-core = { module = "com.github.hypfvieh:dbus-java-core", version.ref = "dbus-java" }
dbus-java-transport-unixsocket = { module = "com.github.hypfvieh:dbus-java-transport-native-unixsocket", version.ref = "dbus-java" }
libvlc-android = { module = "dev.kobbler.vlc:libvlc-all", version.ref = "libvlc-android" }
libvlc-linux = { module = "dev.kobbler.vlc:libvlc-linux-x64", version.ref = "libvlc-linux" }
work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "androidx-profileinstaller" }
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "androidx-benchmark" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "androidx-uiautomator" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
compose-hot-reload = { id = "org.jetbrains.compose.hot-reload", version.ref = "compose-hot-reload" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
android-test = { id = "com.android.test", version.ref = "agp" }
androidx-baselineprofile = { id = "androidx.baselineprofile", version.ref = "androidx-benchmark" }
